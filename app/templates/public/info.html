{% extends "public/base.html" %}
{% block title %}{{ title }} — PARTIPOLIA{% endblock %}

{% block content %}
<section class="bg-navy-900 text-white">
  <div class="mx-auto max-w-6xl px-4 py-12">
    <h1 class="text-3xl font-extrabold sm:text-4xl">{{ title }}</h1>
    <p class="mt-3 max-w-3xl text-navy-100">{{ lead }}</p>
  </div>
</section>
<div class="mx-auto max-w-4xl space-y-6 px-4 pt-10">
  {% for heading, text in sections %}
  <section class="card">
    <h2 class="font-bold text-navy-900">{{ heading }}</h2>
    <p class="mt-2 text-slate-700">{{ text }}</p>
  </section>
  {% endfor %}
</div>
{% endblock %}
