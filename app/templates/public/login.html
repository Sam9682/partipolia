{% extends "public/base.html" %}
{% block title %}Connexion — PARTIPOLIA{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 pt-12" data-testid="login">
  <h1 class="text-2xl font-extrabold text-navy-900">Connexion</h1>
  <p class="mt-2 text-sm text-slate-600">Connectez-vous avec votre adresse e-mail et votre mot de passe.</p>
  <form
    class="card mt-6 space-y-4"
    action="/api/v1/auth/login"
    method="post"
    data-testid="login-form"
    x-data="{
      error: '', loading: false,
      async submit(event) {
        this.error = ''; this.loading = true;
        const form = event.target;
        try {
          const response = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email: form.email.value, password: form.password.value }),
          });
          if (response.ok) { window.location.assign('/'); return; }
          this.error = 'Identifiants invalides. Veuillez réessayer.';
        } catch (err) {
          this.error = 'Une erreur est survenue. Veuillez réessayer.';
        } finally { this.loading = false; }
      }
    }"
    @submit.prevent="submit($event)"
  >
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Adresse e-mail</label>
      <input type="email" id="email" name="email" required autocomplete="email" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <p class="text-sm text-red-700" role="alert" x-show="error" x-text="error"></p>
    <button type="submit" class="btn-primary w-full" :disabled="loading">Se connecter</button>
  </form>
</section>
{% endblock %}
