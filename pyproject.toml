[project]
name = "partipolia"
version = "0.1.0"
description = "PARTIPOLAI — plateforme de parti politique virtuel (monolithe modulaire FastAPI + PostgreSQL/pgvector + Redis + Celery + RAG)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "PARTIPOLAI" }]

dependencies = [
    # Web framework & serveur ASGI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    # Validation & configuration (Pydantic v2)
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    # Base de données : SQLAlchemy 2.x async + psycopg 3 + pgvector + migrations
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "greenlet>=3.1",
    # Cache / broker / rate limit
    "redis>=5.1",
    # Tâches asynchrones
    "celery>=5.4",
    # Rendu SSR
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    # Sécurité : hachage de mots de passe & JWT
    "argon2-cffi>=23.1",
    "bcrypt>=4.2",
    "python-jose[cryptography]>=3.3",
    # Ingestion documentaire (extraction de formats)
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    # Journalisation structurée
    "structlog>=24.4",
]

[project.optional-dependencies]
# Providers IA optionnels, sélectionnés par configuration (LLM_PROVIDER / EMBEDDING_PROVIDER)
openai = ["openai>=1.51"]
anthropic = ["anthropic>=0.36"]
local = ["sentence-transformers>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "types-python-jose>=3.3",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Ruff — linting & formatage
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
]
ignore = ["B008"]  # FastAPI utilise des appels dans les valeurs par défaut (Depends)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# Mypy — typage statique
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "unit: tests unitaires de logique métier pure",
    "integration: tests d'intégration (base, Redis, Docker)",
    "api: tests des points d'accès HTTP",
    "rag: tests du pipeline RAG et jeux d'évaluation",
    "property: tests basés sur les propriétés (Hypothesis)",
]
