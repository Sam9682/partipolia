# ---------------------------------------------------------------------------
# PARTIPOLAI — Configuration principale Nginx (bordure)
# HTTPS, en-têtes de sécurité et limitation de débit de bordure
# (Exigences 26.1, 26.4, 26.5, 26.6).
# ---------------------------------------------------------------------------
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Journalisation ----------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # --- Réglages de transport ---------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;                 # ne pas divulguer la version de Nginx
    client_max_body_size 20m;            # marge pour l'ingestion de documents

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # --- Zones de limitation de débit de bordure (Exigences 26.4, 26.5) ----
    # Clé = adresse IP cliente. La limite applicative Redis reste en second
    # rideau ; cette limite de bordure amortit les pics avant le backend.
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/s;
    # Protection renforcée du point d'accès chat (Exigence 26.5).
    limit_req_zone  $binary_remote_addr zone=chat:10m    rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # --- Amont : service web FastAPI (réseau Compose) ----------------------
    upstream partipolia_web {
        server web:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
