# ---------------------------------------------------------------------------
# PARTIPOLAI — Serveur virtuel de bordure (HTTPS + sécurité + rate limit)
# Exigences 26.1 (tout via HTTPS), 26.4/26.5 (rate limit), 26.6 (en-têtes).
# ---------------------------------------------------------------------------

# --- Redirection HTTP -> HTTPS (Exigence 26.1) -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Autoriser les challenges ACME (renouvellement de certificats) en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Serveur HTTPS ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- En-têtes de sécurité (Exigence 26.6) ------------------------------
    # X-Request-ID est également posé/propagé par le middleware applicatif ;
    # ici, on garantit sa présence dès la bordure.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Limite de connexions simultanées par IP (défense de bordure).
    limit_conn conn 20;

    # --- En-têtes de proxy communs -----------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # --- Point d'accès chat : protection renforcée (Exigence 26.5) ---------
    location = /api/v1/chat {
        limit_req zone=chat burst=3 nodelay;
        proxy_pass http://partipolia_web;
    }

    # --- Points d'accès d'authentification sensibles (Exigence 26.4) -------
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://partipolia_web;
    }

    # --- Health checks (non limités) ---------------------------------------
    location = /health {
        proxy_pass http://partipolia_web;
        access_log off;
    }
    location = /ready {
        proxy_pass http://partipolia_web;
        access_log off;
    }

    # --- Fichiers statiques servis par le backend --------------------------
    location /static/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://partipolia_web;
    }

    # --- Reste du trafic (API + SSR) ---------------------------------------
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://partipolia_web;
    }
}
