# PARTIPOLAI — Configuration Alembic (Exigence 32.4 : migrations reproductibles).
#
# L'URL de connexion n'est PAS renseignée ici (aucun secret dans Git — Exigence 32.6).
# Elle est lue à l'exécution depuis ``settings.database_url`` (variable DATABASE_URL)
# dans ``alembic/env.py``, avec le driver async psycopg 3 : postgresql+psycopg://

[alembic]
# Emplacement des scripts de migration (relatif à ce fichier).
script_location = alembic

# Modèle de nom de fichier de révision : horodatage + slug pour un tri chronologique.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Chemin ajouté à sys.path pour permettre les imports ``app.*`` depuis env.py.
prepend_sys_path = .

# Fuseau horaire des horodatages de révision (UTC pour la reproductibilité).
timezone = UTC

# sqlalchemy.url est volontairement omis : il est fourni dynamiquement par env.py
# depuis settings.database_url afin de ne jamais committer de secret.

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
